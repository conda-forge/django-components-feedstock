# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.152.0"

package:
  name: django-components
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-components/django_components-${{ version }}.tar.gz
  sha256: bbd3e1a735f60efb3b214eddfd4b95fa7e693c7cc95031d5ef05ff8207dfc97b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - django >=5.2
    - djc-core >=1.3.1
    - typing_extensions >=4.12.2

tests:
  - python:
      imports:
        - django_components
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/django-components/django-components/
  license: MIT
  license_file: LICENSE
  summary: A way to create simple reusable template components in Django.
  description: |
    A way to create simple reusable template components in Django.
  documentation: https://django-components.github.io/django-components/
  repository: https://github.com/django-components/django-components
extra:
  recipe-maintainers:
    - rxm7706
